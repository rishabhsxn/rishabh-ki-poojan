<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space under the garland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Storyboard copy of the start page (website/index.html, v29 with every diya dark until the tap), the palace only.
   The hash picks the space under the garland: #g=0|s|m|l, plus &lit=1 (start lit), &auto=0 (wait for a tap), &dmax=1. */
:root{color-scheme:dark;--moon:#c9c8da;--marble:#f3e6cd;--diya:#f2b04a;--title:"Italiana","Cormorant Garamond",serif;--body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#070d1f}
body{color:var(--marble);font-family:var(--body);font-weight:300;font-size:1.0625rem;line-height:1.65;-webkit-font-smoothing:antialiased}
.hero{position:relative;height:100vh;min-height:560px;overflow:hidden;cursor:pointer;background:#070d1f;user-select:none;-webkit-user-select:none}
.hero.lit{cursor:default}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-top{position:absolute;left:0;right:0;top:calc(clamp(58px,9vh,88px) + var(--gap,0px));padding:0 20px;text-align:center;pointer-events:none;display:grid;justify-items:center}
.pre,.post{grid-area:1/1}
.pre{opacity:1;transition:opacity .6s ease .5s}
.post{opacity:0;transition:opacity .5s ease}
.hero.lit .pre{opacity:0;transition:opacity .7s ease}
.hero.lit .post{opacity:1;transition:opacity 1.8s ease 3s}
.instant .hero.lit .post{transition:none}
.invited{margin:0 0 .15em;font-family:var(--title);font-size:clamp(2.5rem,8.5vw,4.4rem);line-height:1.05;color:var(--moon)}
.eyebrow{margin:0 0 .6em;font-size:.78rem;letter-spacing:.34em;text-transform:uppercase;color:var(--moon);font-weight:400}
.names{margin:0;font-family:var(--title);font-weight:400;font-size:clamp(2.5rem,9.4vw,5.2rem);line-height:1;letter-spacing:.02em;color:var(--marble);text-shadow:0 0 28px rgba(242,176,74,.5),0 0 90px rgba(242,176,74,.28);display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;column-gap:.28em}
.names .amp{font-size:.5em;color:var(--diya)}
.when{margin:.9em 0 0;font-size:.9rem;letter-spacing:.3em;text-transform:uppercase;font-weight:400;color:var(--marble)}
.hero-bottom{position:absolute;left:clamp(18px,5vw,56px);bottom:clamp(22px,4.5vh,44px);pointer-events:none}
.pill{pointer-events:auto;font:inherit;font-size:.8rem;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--marble);background:rgba(10,18,38,.55);border:1px solid rgba(242,176,74,.7);border-radius:999px;padding:.85em 1.6em;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.onward{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--marble);padding:.85em 0;display:none;text-shadow:0 1px 10px rgba(7,13,31,.9)}
.hero.lit #light{display:none}
.hero.lit .onward{display:inline-block}
/* the music button, shown once the diyas are lit, as on the site */
.ctl{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(240,217,160,.6);background:rgba(14,22,52,.72);color:#f0d9a0;display:grid;place-items:center;opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:none}
.hero.lit~.ctl{opacity:1;transform:none}
.ctl svg{width:18px;height:18px;overflow:visible}
@media (max-width:640px){.names{flex-direction:column;align-items:center;row-gap:.04em}}
</style>
</head>
<body>
<div class="hero" id="hero">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="hero-top">
    <div class="pre">
      <p class="invited">You're invited</p>
      <p class="eyebrow">to a wedding in Udaipur</p>
    </div>
    <div class="post">
      <p class="eyebrow">Welcome to the wedding of</p>
      <h1 class="names"><span>Rishabh</span><span class="amp">&amp;</span><span>Poojan</span></h1>
      <p class="when">Udaipur</p>
    </div>
  </div>
  <div class="hero-bottom">
    <button id="light" class="pill" type="button">Tap to light the diyas</button>
    <span class="onward">Scroll down ↓</span>
  </div>
</div>
<div class="ctl" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5h3.5l5-4v13l-5-4H3.5Z" fill="currentColor" stroke-width="1.4"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg></div>
<script>
(function(){
  var hero=document.getElementById('hero'),cv=document.getElementById('scene'),g=cv.getContext('2d');
  var btn=document.getElementById('light'),post=hero.querySelector('.post');
  var topBox=hero.querySelector('.hero-top');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,D=1,hz=0,u=1,PW=0,PH=0,px0=0,vy0=0,Q=1,lastE=-1,narrow=false;
  var litAt=null,covered=false,visible=true,raf=0,prev=0,sparks=[],rockets=[],nextFw=0,shots=0,fly=0,sway=[0,0],swayTo=[0,0];
  var things=[];
  var HP={};location.hash.replace(/^#/,'').split('&').forEach(function(kv){var q=kv.split('=');if(q[0])HP[q[0]]=q[1]===undefined?'1':q[1];});
  var GAPS={0:[0,0],s:[.028,.036],m:[.052,.062],y:[52/844,64/900],l:[.076,.089]},GK=GAPS[HP.g]||GAPS[0],G=0;
  var OPT={lit:HP.lit==='1',auto:HP.auto!=='0'};

  /* depth of each layer: bigger is further away. The camera position c runs from 0 past each one. */
  var DF=3.0,DM=3.25,DR=3.65,DH1=11,DH2=8,DT=1.15,IN=[3.55,4.1],DEND=4.75,CMAX=4.5;
  var lay=[document.createElement('canvas'),document.createElement('canvas'),document.createElement('canvas')];
  var DMAX=HP.dmax?+HP.dmax:2,slow=0,lastT=0;   /* drawing resolution steps down by itself if frames run long */
  var dark=[0,1,2].map(function(){return document.createElement('canvas');}),full=[0,1,2].map(function(){return document.createElement('canvas');});

  var seed=20270129;
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  var stars=[],i;
  for(i=0;i<150;i++)stars.push({x:rnd(),y:rnd()*.56,r:rnd()*1.1+.3,p:rnd()*6.28});

  function clamp(v){return v<0?0:v>1?1:v;}
  function smooth(v){v=clamp(v);return v*v*(3-2*v);}
  function mix(a,b,t){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';}

  /* ground: where a point at depth d sits on screen before the camera moves, and how big things look there */
  function gyAt(d){return vy0+(hz-vy0)*DF/d;}
  function dAt(y){return DF*(hz-vy0)/(y-vy0);}

  function size(){
    W=hero.clientWidth;H=hero.clientHeight;D=Math.min(window.devicePixelRatio||1,DMAX);
    cv.width=Math.round(W*D);cv.height=Math.round(H*D);
    narrow=W<700;
    G=Math.round(H*(narrow?GK[0]:GK[1]));hero.style.setProperty('--gap',G+'px');   /* space added under the garland */
    hz=Math.round(H*(narrow?.55:.6))+(narrow?46:58)+G;window.__hz=hz;
    window.__m={gap:G,water:H-hz,textTop:Math.round(topBox.getBoundingClientRect().top-hero.getBoundingClientRect().top)};
    var nb=post.getBoundingClientRect().bottom-hero.getBoundingClientRect().top+16;
    PW=Math.max(240,Math.min(W*.98,920,(hz-nb)*100/37));u=PW/100;PH=Math.ceil(37*u);px0=(W-PW)/2;
    vy0=hz-(H-hz)*.9;Q=0;lastE=-1;
    var k,j,d,y;
    things=[];
    /* the quiet lake: no ghat, just eight diyas in two lines that open towards the viewer like a V, with clear water
       round the names, "Scroll down" and the music button. All of them stay dark until the tap.
       Each pair is [across the screen, from the palace (0) to the bottom (1)]. */
    function fl(fx,fd,fp){y=hz+24+Math.pow(fd,1.3)*(H-hz-64);
      things.push({t:'diya',x:fx*W,y:y,d:dAt(y),s:(3+fd*6.5)*(narrow?.85:1),p:fp});}
    [[.37,.1],[.27,.34],[.19,.6],[.11,.8],[.63,.18],[.72,.43],[.81,.7],[.89,.85]].forEach(function(q,n){fl(q[0],q[1],n*2.1+.7);});
    things.sort(function(p,q){return q.d-p.d;});
  }

  /* ---------- the building, in three layers. Units: x 0..100, y up from the ground ---------- */
  function X(v){return v*u;} function Y(v){return PH-v*u;}
  function ey(e,y){return clamp(e*1.9-y/37*.9);}
  var TONE=[
    {un:[40,36,66],unB:[46,41,74],top:[112,66,66],bot:[186,116,100]},      /* rear wing: furthest, dimmest */
    {un:[52,45,76],unB:[58,50,84],top:[150,90,82],bot:[232,160,132]},      /* main front */
    {un:[66,57,92],unB:[74,64,100],top:[190,124,106],bot:[252,204,168]}];  /* towers and entrance: nearest, brightest */
  function wall(c,e,L,x,y,w,h){
    var t=TONE[L],gr=c.createLinearGradient(0,Y(y+h),0,Y(y));
    gr.addColorStop(0,mix(t.un,t.top,ey(e,y+h)));gr.addColorStop(1,mix(t.unB,t.bot,ey(e,y)));
    c.fillStyle=gr;c.fillRect(X(x),Y(y+h),w*u,h*u);
  }
  function solid(c,e,L,y){var t=TONE[L];c.fillStyle=mix(t.un,[(t.top[0]+t.bot[0])/2,(t.top[1]+t.bot[1])/2,(t.top[2]+t.bot[2])/2],ey(e,y));}
  function shade(c,x,y,w){c.fillStyle='rgba(10,8,30,.22)';c.fillRect(X(x),Y(y),w*u,Math.max(1,.6*u));}
  function ogee(c,x,y,w,h){
    c.beginPath();c.moveTo(X(x-w/2),Y(y));c.lineTo(X(x-w/2),Y(y+h*.5));
    c.bezierCurveTo(X(x-w/2),Y(y+h*.86),X(x-w*.1),Y(y+h*.8),X(x),Y(y+h));
    c.bezierCurveTo(X(x+w*.1),Y(y+h*.8),X(x+w/2),Y(y+h*.86),X(x+w/2),Y(y+h*.5));
    c.lineTo(X(x+w/2),Y(y));c.closePath();
  }
  function opening(c,e,x,y,w,h){
    var a=ey(e,y);ogee(c,x,y,w,h);c.shadowBlur=0;c.fillStyle='#141230';c.fill();
    if(a>0){var gr=c.createLinearGradient(0,Y(y+h),0,Y(y));
      gr.addColorStop(0,'rgba(255,150,60,'+a+')');gr.addColorStop(.6,'rgba(255,208,120,'+a+')');gr.addColorStop(1,'rgba(255,240,190,'+a+')');
      c.shadowColor='rgba(255,150,50,'+(.85*a)+')';c.shadowBlur=6*D*Q*a;c.fillStyle=gr;c.fill();c.shadowBlur=0;}
  }
  function dome(c,cx,by,r){
    c.beginPath();c.moveTo(X(cx-r),Y(by));
    c.bezierCurveTo(X(cx-r*1.32),Y(by+r*.95),X(cx-r*.35),Y(by+r*1.15),X(cx),Y(by+r*1.8));
    c.bezierCurveTo(X(cx+r*.35),Y(by+r*1.15),X(cx+r*1.32),Y(by+r*.95),X(cx+r),Y(by));
    c.closePath();c.fill();
    c.fillRect(X(cx)-Math.max(.6,r*u*.045),Y(by+r*2.3),Math.max(1.2,r*u*.09),r*u*.55);
    c.beginPath();c.arc(X(cx),Y(by+r*1.95),Math.max(1,r*u*.15),0,6.29);c.fill();
  }
  function chhatri(c,e,L,cx,by,s){
    solid(c,e,L,by);
    var k,px=[-1.9,-.65,.6,1.55];for(k=0;k<4;k++)c.fillRect(X(cx+px[k]*s),Y(by+2.7*s),.38*s*u,2.7*s*u);
    c.fillRect(X(cx-2.7*s),Y(by+3.15*s),5.4*s*u,.45*s*u);c.fillRect(X(cx-2.1*s),Y(by+3.5*s),4.2*s*u,.4*s*u);
    dome(c,cx,by+3.5*s,1.85*s);
  }
  function rail(c,e,L,x0,x1,y){
    solid(c,e,L,y);c.fillRect(X(x0),Y(y+1.1),(x1-x0)*u,Math.max(1,.26*u));
    for(var q=x0+.3;q<x1;q+=.95)c.fillRect(X(q),Y(y+1.1),Math.max(.7,.24*u),1.1*u);
  }
  function jharokha(c,e,L,x,y,s){
    solid(c,e,L,y);
    c.beginPath();c.moveTo(X(x-2.4*s),Y(y));c.lineTo(X(x+2.4*s),Y(y));c.lineTo(X(x+1.3*s),Y(y-1.4*s));c.lineTo(X(x-1.3*s),Y(y-1.4*s));c.closePath();c.fill();
    wall(c,e,2,x-2.4*s,y,4.8*s,5*s);opening(c,e,x,y+.6*s,2.5*s,3.8*s);
    solid(c,e,L,y+5*s);c.fillRect(X(x-3.1*s),Y(y+5.45*s),6.2*s*u,.45*s*u);dome(c,x,y+5.45*s,1.8*s);
  }
  function lights(c,e,x0,x1,y){
    var a=ey(e,y);if(a<=0)return;
    c.shadowColor='rgba(255,170,70,'+a+')';c.shadowBlur=4*D*Q;c.fillStyle='rgba(255,232,170,'+a+')';
    for(var q=x0+.6;q<x1;q+=1.45){c.beginPath();c.arc(X(q),Y(y),Math.max(.8,u*.2),0,6.29);c.fill();}
    c.shadowBlur=0;
  }
  function floods(c,e,xs,r){
    var a=ey(e,0);if(a<=0)return;c.globalCompositeOperation='source-atop';
    for(var k=0;k<xs.length;k++){var gr=c.createRadialGradient(X(xs[k]),Y(0),0,X(xs[k]),Y(0),r*u);
      gr.addColorStop(0,'rgba(255,230,180,'+(.5*a)+')');gr.addColorStop(1,'rgba(255,230,180,0)');
      c.fillStyle=gr;c.fillRect(X(xs[k]-r),Y(r),2*r*u,r*u);}
    c.globalCompositeOperation='source-over';
  }
  function paint(L,e,cvs){
    var c=cvs.getContext('2d'),x,r,k,rows=[1.6,7.6,13.6];
    c.setTransform(D*Q,0,0,D*Q,0,0);c.globalCompositeOperation='source-over';c.clearRect(0,0,PW,PH);
    if(L===0){                                               /* rear wing rising behind the roofline */
      wall(c,e,0,18,0,64,25);
      solid(c,e,0,25);for(x=18.6;x<82;x+=2.2)c.fillRect(X(x),Y(25.8),1.1*u,.8*u);
      [27,38.5,61.5,73].forEach(function(v){chhatri(c,e,0,v,25,.92);});chhatri(c,e,0,50,25,1.35);
      for(x=21.5;x<=79;x+=4.1)opening(c,e,x,20.2,1.9,3.2);
      shade(c,18,25,64);lights(c,e,18,82,25.2);
    }else if(L===1){                                         /* the long three-storey front */
      wall(c,e,1,10,0,80,18);
      for(r=0;r<3;r++)for(x=13.2;x<=37.5;x+=4.05){opening(c,e,x,rows[r],2.3,3.7);opening(c,e,100-x,rows[r],2.3,3.7);}
      shade(c,10,6,80);shade(c,10,12,80);rail(c,e,1,10,90,18);shade(c,10,18,80);
      floods(c,e,[16,26,36,64,74,84],7);
      lights(c,e,10,90,6.2);lights(c,e,10,90,12.2);lights(c,e,10,90,18.2);
    }else{                                                   /* corner towers and the entrance block, standing forward */
      for(k=0;k<2;k++){var tx=k?90:0;
        wall(c,e,2,tx,0,10,22);for(r=0;r<3;r++)opening(c,e,tx+5,rows[r],2.6,3.9);opening(c,e,tx+5,18.2,2.2,2.6);
        shade(c,tx,22,10);chhatri(c,e,2,tx+5,22,1.4);lights(c,e,tx,tx+10,22.2);lights(c,e,tx,tx+10,.5);}
      wall(c,e,2,40,0,20,23);
      opening(c,e,44,13.6,2.2,3.7);opening(c,e,56,13.6,2.2,3.7);opening(c,e,44,7.9,2.2,3.5);opening(c,e,56,7.9,2.2,3.5);
      jharokha(c,e,2,50,12.6,1.2);
      shade(c,40,23,20);chhatri(c,e,2,50,23,1.5);chhatri(c,e,2,42.8,23,.9);chhatri(c,e,2,57.2,23,.9);
      opening(c,e,50,0,6.4,7.6);                             /* the gate */
      floods(c,e,[42,58],6);lights(c,e,40,60,23.2);lights(c,e,40,60,.5);
    }
  }

  /* ---------- camera ---------- */
  var cam=0,Ax=0,Ay=0,Cx=0,Cy=0;
  function setCam(){
    cam=fly*CMAX;
    var gx=W/2,gy=hz-3.8*u,t=smooth(cam/2.3),k=smooth(cam/2.7),idle=1-clamp(cam/.6);
    Ax=W/2;Ay=vy0+(gy-vy0)*t;                    /* the point the view closes in on: horizon first, then the gate */
    Cx=Ax+(W/2-Ax)*k+0;Cy=Ay+(H/2-Ay)*k;
    sway[0]+=(swayTo[0]*idle-sway[0])*.06;sway[1]+=(swayTo[1]*idle-sway[1])*.06;
  }
  /* put the canvas into the frame of a layer at depth d; returns its scale, or 0 once the camera has passed it */
  function at3(d){
    var s=d>cam+.02?d/(d-cam):0;if(!s)return 0;
    var k=34/d;
    g.setTransform(D*s,0,0,D*s,D*(Cx+sway[0]*k-Ax*s),D*(Cy+sway[1]*k-Ay*s));return s;
  }
  function scrY(d,y){var s=d/(d-cam);return Cy+sway[1]*34/d+(y-Ay)*s;}
  function scrX(d,x){var s=d/(d-cam);return Cx+sway[0]*34/d+(x-Ax)*s;}

  function ridge(base,amp,f,ph,col){
    g.beginPath();g.moveTo(-W,hz+H);
    for(var x=-W;x<=2*W;x+=10){var n=x/W;g.lineTo(x,hz-base-amp*(Math.sin(n*f+ph)*.55+Math.sin(n*f*2.3+ph*1.7)*.3+Math.sin(n*f*5.1+ph)*.15+.6));}
    g.lineTo(2*W,hz+H);g.closePath();g.fillStyle=col;g.fill();
  }
  function diya(dx,dy,sz,a,t,p,streak){
    if(a>0){g.globalCompositeOperation='lighter';
      var hr=sz*3.6,fk=.9+.1*Math.sin(t*9+p*3),rg=g.createRadialGradient(dx,dy-sz*.5,0,dx,dy-sz*.5,hr);   /* a small glow: flames, not haze */
      rg.addColorStop(0,'rgba(255,176,80,'+(.43*a*fk)+')');rg.addColorStop(1,'rgba(255,176,80,0)');
      g.fillStyle=rg;g.fillRect(dx-hr,dy-sz*.5-hr,hr*2,hr*2);
      if(streak){var rl=g.createLinearGradient(0,dy,0,dy+sz*4);
        rl.addColorStop(0,'rgba(255,186,90,'+(.3*a)+')');rl.addColorStop(1,'rgba(255,186,90,0)');
        g.fillStyle=rl;g.fillRect(dx-sz*.45,dy+sz*.3,sz*.9,sz*4);}
      g.globalCompositeOperation='source-over';}
    g.fillStyle='#4a2616';g.beginPath();g.ellipse(dx,dy,sz*.9,sz*.34,0,0,6.29);g.fill();
    g.fillStyle='#7a4124';g.beginPath();g.ellipse(dx,dy-sz*.1,sz*.75,sz*.2,0,0,6.29);g.fill();
    if(a>0){var tip=Math.sin(t*7+p*5)*sz*.12;g.globalAlpha*=a;
      var fg=g.createLinearGradient(0,dy-sz*1.5,0,dy);fg.addColorStop(0,'#ffb238');fg.addColorStop(.6,'#ffe9a8');fg.addColorStop(1,'#fff6d8');
      g.fillStyle=fg;g.beginPath();g.moveTo(dx-sz*.26,dy-sz*.22);
      g.quadraticCurveTo(dx-sz*.3,dy-sz*.8,dx+tip,dy-sz*1.45);
      g.quadraticCurveTo(dx+sz*.3,dy-sz*.8,dx+sz*.26,dy-sz*.22);
      g.quadraticCurveTo(dx,dy+sz*.05,dx-sz*.26,dy-sz*.22);g.fill();}
  }
  /* nearest layer: a marigold toran across the top with a lantern at each side */
  function toran(ge,la,t){
    var n=narrow?3:5,seg=W/n,k,j,r=narrow?5.2:6.4;
    function bead(x,y,q){g.fillStyle=q%2?mix([120,62,24],[244,150,30],ge):mix([140,96,30],[255,200,60],ge);g.beginPath();g.arc(x,y,r,0,6.29);g.fill();}
    for(k=0;k<n;k++)for(j=0;j<=14;j++){var tt=j/14;bead(k*seg+seg*tt,-2+Math.sin(Math.PI*tt)*seg*.2+Math.sin(t*1.1+k+tt*3)*1.2,j+k);}
    for(k=0;k<=n;k++){var len=(k===0||k===n?H*.2:H*.075);for(j=1;j*r*1.7<len;j++)bead(k*seg+Math.sin(t*1.3+k+j*.4)*1.4,-2+j*r*1.7,j);}
    [].forEach(function(lx,q){var ly=H*.17+Math.sin(t*.9+q)*2,hh=narrow?15:20;
      g.strokeStyle=mix([70,56,50],[150,110,60],ge);g.lineWidth=1.2;g.beginPath();g.moveTo(lx,-4);g.lineTo(lx,ly);g.stroke();
      if(la>0){g.globalCompositeOperation='lighter';var rg=g.createRadialGradient(lx,ly+hh*.5,0,lx,ly+hh*.5,hh*3.2);
        rg.addColorStop(0,'rgba(255,180,90,'+(.5*la)+')');rg.addColorStop(1,'rgba(255,180,90,0)');
        g.fillStyle=rg;g.fillRect(lx-hh*3.2,ly-hh*2.7,hh*6.4,hh*6.4);g.globalCompositeOperation='source-over';}
      g.fillStyle=mix([70,58,60],[176,124,52],ge);g.beginPath();g.moveTo(lx,ly-hh*.25);g.lineTo(lx+hh*.42,ly+hh*.1);g.lineTo(lx-hh*.42,ly+hh*.1);g.closePath();g.fill();
      g.fillRect(lx-hh*.36,ly+hh*.95,hh*.72,hh*.14);
      g.fillStyle=la>0?mix([60,54,74],[255,232,180],la):'#3a3550';g.fillRect(lx-hh*.3,ly+hh*.1,hh*.6,hh*.85);});
  }
  /* arch shape shared by the gate and the rooms beyond it, in screen pixels */
  function archPath(cx,base,w,h){
    g.moveTo(cx-w/2,base);g.lineTo(cx-w/2,base-h*.5);
    g.bezierCurveTo(cx-w/2,base-h*.86,cx-w*.1,base-h*.8,cx,base-h);
    g.bezierCurveTo(cx+w*.1,base-h*.8,cx+w/2,base-h*.86,cx+w/2,base-h*.5);
    g.lineTo(cx+w/2,base);g.closePath();
  }

  var cols=['255,214,130','255,150,100','250,190,205','255,240,200'];
  function burst(bx,by){
    var c=cols[Math.random()*cols.length|0],n=narrow?46:70;
    for(var k=0;k<n;k++){var a=Math.random()*6.283,s=(30+Math.random()*120)*(narrow?.75:1);
      sparks.push({x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:1.1+Math.random()*.9,c:c});}
  }
  function launch(now){
    var top=Math.max(40,hz-PH-20),side=Math.random()<.5;
    rockets.push({x:(side?.08+Math.random()*.3:.62+Math.random()*.3)*W,y0:hz-PH*.5,ty:top*(.2+Math.random()*.8),t0:now});
  }

  function draw(now){
    var t=now/1000,dt=Math.min(.05,(now-prev)/1000||0),k,s,o;prev=now;
    var el=litAt===null?-1:now-litAt,span=H-(hz-PH);
    function lit(y){return el<0?0:clamp((el-(H-y)/span*2600)/420);}
    var e=0;if(el>=0){var q=clamp((el-1500)/1900);e=1-Math.pow(1-q,3);}
    var ge=el<0?0:clamp(el/1500);
    swayTo=reduce?[0,0]:(narrow?[Math.sin(t*.33)*.5,Math.sin(t*.21)*.25]:swayTo);
    setCam();

    /* sky: never moves */
    g.setTransform(D,0,0,D,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';
    var sky=g.createLinearGradient(0,0,0,hz);
    sky.addColorStop(0,'#060b1e');sky.addColorStop(.5,'#141d4c');sky.addColorStop(.82,'#4a3263');sky.addColorStop(.95,'#a05a6c');sky.addColorStop(1,'#de9163');
    g.fillStyle=sky;g.fillRect(0,0,W,H);
    for(k=0;k<stars.length;k++){var st=stars[k];g.globalAlpha=(.35+.45*Math.sin(t*1.3+st.p))*(1-st.y/.6);
      g.fillStyle='#e9e6ff';g.beginPath();g.arc(st.x*W,st.y*H,st.r,0,6.29);g.fill();}
    g.globalAlpha=1;
    if(el>=0&&!reduce&&now>nextFw&&cam<1.2){launch(now);shots++;nextFw=now+(shots<6?260+Math.random()*260:1500+Math.random()*2000);}
    if(rockets.length||sparks.length){g.globalCompositeOperation='lighter';
      for(k=rockets.length-1;k>=0;k--){var rk=rockets[k],rq=(now-rk.t0)/700;
        if(rq>=1){burst(rk.x,rk.ty);rockets.splice(k,1);continue;}
        var ry=rk.y0+(rk.ty-rk.y0)*(1-Math.pow(1-rq,2));
        g.strokeStyle='rgba(255,220,160,.8)';g.lineWidth=1.6;g.beginPath();g.moveTo(rk.x,ry+16);g.lineTo(rk.x,ry);g.stroke();}
      g.lineWidth=1.7;g.lineCap='round';
      for(k=sparks.length-1;k>=0;k--){var sp=sparks[k];sp.l+=dt;if(sp.l>sp.m){sparks.splice(k,1);continue;}
        sp.vx*=.982;sp.vy=sp.vy*.982+42*dt;sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;
        g.strokeStyle='rgba('+sp.c+','+(1-sp.l/sp.m)+')';g.beginPath();g.moveTo(sp.x-sp.vx*.05,sp.y-sp.vy*.05);g.lineTo(sp.x,sp.y);g.stroke();}
      g.globalCompositeOperation='source-over';}

    /* mountains, two layers */
    if(at3(DH1))ridge(H*.035,H*.07,5.2,.6,'#262851');
    if(at3(DH2))ridge(H*.012,H*.05,7.4,2.1,'#1a1f45');

    var through=cam>=DF-.03;
    if(!through){
      /* the lake, in screen space, from the furthest building's foot to the bottom edge */
      g.setTransform(D,0,0,D,0,0);
      var top=scrY(DR,hz),wat=g.createLinearGradient(0,top,0,Math.max(H,top+1));
      wat.addColorStop(0,'#4d3058');wat.addColorStop(.14,'#232252');wat.addColorStop(.5,'#0f1838');wat.addColorStop(1,'#0a1226');
      g.fillStyle=wat;g.fillRect(0,top,W,Math.max(0,H-top));

      /* the building: redraw its layers when the light changes or the camera needs more detail */
      var sF=DF/(DF-cam),wq=Math.max(1,Math.min(sF>2.2?4:sF>1.2?2:1,Math.floor(4096/(PW*D))));
      /* the detailed painting is done only twice (unlit and fully lit); while the light climbs, each frame just blends the two */
      if(wq!==Q){Q=wq;lastE=-1;for(k=0;k<3;k++){[lay,dark,full].forEach(function(set){set[k].width=Math.round(PW*D*Q);set[k].height=Math.round(PH*D*Q);});
        paint(k,0,dark[k]);paint(k,1,full[k]);}}
      if(Math.abs(e-lastE)>.0015){
        for(k=0;k<3;k++){var lc=lay[k].getContext('2d'),lw=lay[k].width,lh=lay[k].height,si;
          lc.setTransform(1,0,0,1,0,0);lc.globalCompositeOperation='source-over';lc.clearRect(0,0,lw,lh);
          if(e<=0)lc.drawImage(dark[k],0,0);
          else if(e>=1)lc.drawImage(full[k],0,0);
          else{lc.drawImage(full[k],0,0);
            var mg=lc.createLinearGradient(0,lh,0,lh-37*u*D*Q);
            for(si=0;si<=18;si++)mg.addColorStop(si/18,'rgba(0,0,0,'+clamp(e*1.9-si/18*.9)+')');
            lc.globalCompositeOperation='destination-in';lc.fillStyle=mg;lc.fillRect(0,0,lw,lh);
            lc.globalCompositeOperation='destination-over';lc.drawImage(dark[k],0,0);lc.globalCompositeOperation='source-over';}}
        lastE=e;}
      if(at3(DR))g.drawImage(lay[0],px0,hz-PH,PW,PH);
      if(at3(DM))g.drawImage(lay[1],px0,hz-PH,PW,PH);
      if(at3(DF)){g.drawImage(lay[2],px0,hz-PH,PW,PH);
        if(e>0){g.globalCompositeOperation='lighter';var R=PW*.5,gl=g.createRadialGradient(W/2,hz,0,W/2,hz,R);
          gl.addColorStop(0,'rgba(255,170,80,'+(.14*e)+')');gl.addColorStop(1,'rgba(255,170,80,0)');
          g.fillStyle=gl;g.fillRect(W/2-R,hz-R,R*2,R*2);g.globalCompositeOperation='source-over';}}
      /* reflections of the two nearer layers, rippling */
      g.setTransform(D,0,0,D,0,0);
      [[1,DM],[2,DF]].forEach(function(lr){var d=lr[1];if(d<=cam+.05)return;
        var rs=d/(d-cam),yb=scrY(d,hz),xl=scrX(d,px0),rh=Math.min(PH*rs*.85,H-yb),kk;
        for(kk=0;kk<rh;kk+=2){var f=kk/(PH*rs*.85),sr=PH-kk/(rs*.85)-2/rs;if(sr<0)break;
          g.globalAlpha=(.4+.28*e)*(1-f)*(1-f*.5)*clamp((d-cam-.05)/.3);
          g.drawImage(lay[lr[0]],0,sr*D*Q,PW*D*Q,Math.max(1,2/rs)*D*Q,xl+Math.sin(kk*.2/Math.sqrt(rs)+t*1.5)*(1+kk*.035),yb+kk,PW*rs,2);}});
      g.globalAlpha=1;
    }

    /* through the gate: two more arches, a runner on the floor, and light at the far end */
    var gs=through?0:DF/(DF-cam),gw=6.4*u,gh=7.6*u,seen=through||(el>=0&&gs*gw>26);
    if(seen){
      g.setTransform(D,0,0,D,0,0);g.save();
      var vx=scrX(DEND,W/2),end=clamp((cam-(IN[1]-.25))/(CMAX-IN[1]+.25)),IV=[246,234,210];
      if(!through){g.beginPath();archPath(scrX(DF,W/2),scrY(DF,hz),gw*gs,gh*gs);g.clip();g.globalAlpha=clamp(e*2)*clamp((gs*gw-26)/30);}
      g.fillStyle=mix([120,70,48],IV,end);g.fillRect(0,0,W,H);
      var fb=scrY(DEND,hz),lg=g.createRadialGradient(vx,fb-H*.1,0,vx,fb-H*.1,Math.max(W,H)*.8);
      lg.addColorStop(0,mix([255,248,228],IV,end));lg.addColorStop(.45,mix([255,214,140],IV,end));lg.addColorStop(1,mix([196,120,60],IV,end));
      g.fillStyle=lg;g.fillRect(0,0,W,fb);
      var fl=g.createLinearGradient(0,fb,0,H);fl.addColorStop(0,mix([255,226,170],IV,end));fl.addColorStop(1,mix([120,72,48],IV,end));
      g.fillStyle=fl;g.fillRect(0,fb,W,Math.max(0,H-fb));
      g.fillStyle=mix([150,36,40],IV,end);g.beginPath();        /* carpet runner */
      var n0=Math.max(cam+.05,DF-.02);
      g.moveTo(scrX(DEND,W/2-1.5*u),fb);g.lineTo(scrX(DEND,W/2+1.5*u),fb);g.lineTo(scrX(n0,W/2+1.5*u),scrY(n0,hz));g.lineTo(scrX(n0,W/2-1.5*u),scrY(n0,hz));g.closePath();g.fill();
      for(k=IN.length-1;k>=0;k--){var di=IN[k];if(di<=cam+.03)continue;
        var si=di/(di-cam),bx=scrX(di,W/2),by=scrY(di,hz),ww=(k?4.4:5.2)*u*si*1.9,wh=ww*1.5,near=clamp((di-cam-.03)/.8);
        var wg=g.createLinearGradient(0,by-wh*1.6,0,by);
        wg.addColorStop(0,mix([84,44,36],[160,100,70],near));wg.addColorStop(1,mix([132,76,52],[236,172,112],near));
        g.fillStyle=wg;g.beginPath();g.rect(-10,-10,W+20,by+10);archPath(bx,by,ww,wh);g.fill('evenodd');
        g.strokeStyle='rgba(255,230,170,.75)';g.lineWidth=Math.max(1,ww*.02);g.beginPath();archPath(bx,by,ww,wh);g.stroke();
        g.strokeStyle='rgba(255,214,140,.3)';g.lineWidth=Math.max(1,ww*.012);g.beginPath();archPath(bx,by,ww*1.2,wh*1.1);g.stroke();
        var br=Math.max(1.4,ww*.022),bj;                         /* bulbs round the arch, marigolds above it */
        g.fillStyle='rgba(255,238,190,.95)';
        for(bj=0;bj<=24;bj++){var a=Math.PI*(1+bj/24),rxx=ww*.62,ryy=wh*.6;g.beginPath();g.arc(bx+Math.cos(a)*rxx,by-wh*.5+Math.sin(a)*ryy,br,0,6.29);g.fill();}
        for(bj=0;bj<=22;bj++){var tq=bj/22;g.fillStyle=bj%2?'#f29a1e':'#ffc93c';g.beginPath();
          g.arc(bx-ww*.95+ww*1.9*tq,by-wh*1.28+Math.sin(Math.PI*tq)*wh*.16,ww*.045,0,6.29);g.fill();}
        [-1,1].forEach(function(sd){for(bj=1;bj<9;bj++){g.fillStyle=bj%2?'#ffc93c':'#f29a1e';g.beginPath();g.arc(bx+sd*ww*.95,by-wh*1.28+bj*ww*.085,ww*.042,0,6.29);g.fill();}});
      }
      g.restore();g.globalAlpha=1;
    }
    if(!through&&gs>1.6){                                       /* keep the gate's edge crisp close up */
      g.setTransform(D,0,0,D,0,0);g.strokeStyle='rgba(255,226,160,'+clamp((gs-1.6)/2)*clamp(e*2)+')';g.lineWidth=Math.max(1,gs*.5);
      g.beginPath();archPath(scrX(DF,W/2),scrY(DF,hz),gw*gs,gh*gs);g.stroke();}

    /* on the water: floating diyas, far to near; each fades as the camera passes it */
    if(!through)for(k=0;k<things.length;k++){o=things[k];s=at3(o.d);if(!s)continue;
      var fade=clamp((o.d-cam-.02)/.16);g.globalAlpha=fade;
      if(o.t==='diya')diya(o.x+Math.sin(t*.35+o.p)*4,o.y+Math.sin(t*1.2+o.p)*.6,o.s,lit(o.y),t,o.p,true);
      g.globalAlpha=1;}

    if(at3(DT)){g.globalAlpha=clamp((DT-cam-.02)/.2);toran(ge,lit(H*.2),t);g.globalAlpha=1;}

    g.setTransform(D,0,0,D,0,0);
    var done=clamp((fly-.93)/.07);if(done>0){g.globalAlpha=done;g.fillStyle='#f6ead2';g.fillRect(0,0,W,H);g.globalAlpha=1;}
  }

  function loop(now){
    var dt=now-lastT;lastT=now;
    if(dt>0&&dt<250){slow=dt>24?slow+1:Math.max(0,slow-2);
      if(slow>20&&DMAX>1&&(window.devicePixelRatio||1)>1){DMAX=DMAX>1.5?1.5:1;slow=0;size();}}
    draw(now);if(visible)raf=requestAnimationFrame(loop);else raf=0;}
  function ignite(){
    if(litAt!==null)return;
    litAt=reduce?-1e7:performance.now();nextFw=litAt+2700;shots=0;hero.classList.add('lit');
    if(reduce)draw(0);
  }
  function refit(){size();draw(performance.now());}
  refit();
  if(OPT.lit){document.documentElement.classList.add('instant');litAt=performance.now()-9000;nextFw=performance.now()+400;hero.classList.add('lit');}
  if(reduce){litAt=-1e7;hero.classList.add('lit');draw(0);}
  else{
    raf=requestAnimationFrame(loop);
    var armed=false;
    if('IntersectionObserver' in window){new IntersectionObserver(function(en){
      visible=en[0].isIntersecting;if(visible&&!raf)raf=requestAnimationFrame(loop);
      if(en[0].intersectionRatio>=.5&&OPT.auto&&!armed){armed=true;setTimeout(ignite,900);}
    },{threshold:[0,.5]}).observe(hero);}
    else if(OPT.auto)setTimeout(ignite,900);
    hero.addEventListener('pointermove',function(ev){if(ev.pointerType==='mouse'){var r=hero.getBoundingClientRect();
      swayTo=[-((ev.clientX-r.left)/r.width-.5),-((ev.clientY-r.top)/r.height-.5)*.6];}});
  }
  window.addEventListener('resize',refit);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refit);
  hero.addEventListener('pointerdown',ignite);
  btn.addEventListener('click',ignite);
})();
</script>
</body>
