# Publishes the wedding site to GitHub Pages on every push to main.
# Only the live page (and the song clip, if it has been added to the repo) is published;
# old versions, storyboards and concepts stay out of the public site.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir -p _site/media
          cp website/index.html _site/
          touch _site/.nojekyll
          if [ -f website/media/vaaroon-clip.mp3 ]; then cp website/media/vaaroon-clip.mp3 _site/media/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
