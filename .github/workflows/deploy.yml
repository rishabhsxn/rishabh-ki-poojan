# Publishes the wedding site to GitHub Pages on every push to main.
# Only the live page, the song clip and the photos (website/photos) are published;
# old versions, storyboards and concepts stay out of the public site.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the site
        run: |
          mkdir -p _site/media
          cp website/index.html _site/
          touch _site/.nojekyll
          if [ -f website/media/vaaroon-clip.mp3 ]; then cp website/media/vaaroon-clip.mp3 _site/media/; fi
          # the photos (WebP sizes and their list), made by scripts/build_photos.py
          if [ -f website/photos/photos.js ]; then mkdir -p _site/photos && cp website/photos/photos.js website/photos/*.webp _site/photos/; fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
